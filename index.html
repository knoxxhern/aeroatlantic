<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galería y datos de contacto de Gregorio Hernández - Aero Atlantic">
  <title>Aero Atlantic — Galería</title>
  <style>
    :root {
      --navy: #102a43;
      --blue: #2583e8;
      --light-blue: #eaf4ff;
      --background: #f7faff;
      --text: #334e68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-top: 86px;
      background: var(--background);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    /* --- MENÚ SUPERIOR --- */
    .navbar {
      position: fixed;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px max(5%, calc((100% - 1100px) / 2));
      background: var(--navy);
      box-shadow: 0 3px 16px rgb(16 42 67 / 20%);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .logo-text {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.8;
    }

    main {
      width: min(1100px, 90%);
      margin: 0 auto;
      padding: 54px 0 70px;
    }

    .intro {
      margin-bottom: 30px;
      text-align: center;
    }

    .intro h1 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: clamp(2rem, 5vw, 2.8rem);
    }

    .intro p {
      margin: 0;
      line-height: 1.6;
    }

    /* --- REJILLA DE LA GALERÍA --- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .card {
      overflow: hidden;
      aspect-ratio: 1;
      border-radius: 16px;
      background: #dceafa;
      box-shadow: 0 8px 22px rgb(16 42 67 / 12%);
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    /* --- SECCIÓN DE CONTACTO --- */
    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 36px 24px;
      border-radius: 20px;
      background: var(--light-blue);
    }

    .profile-photo {
      width: 140px;
      height: 140px;
      flex: 0 0 auto;
      border: 5px solid #fff;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 5px 16px rgb(16 42 67 / 14%);
    }

    .contact-details h2 {
      margin: 0 0 12px;
      color: var(--navy);
    }

    .contact-details p {
      margin: 8px 0;
    }

    .contact-details a {
      color: var(--blue);
      text-decoration: none;
    }

    /* --- DISEÑO RESPONSIVO --- */
    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      body {
        padding-top: 78px;
      }

      .navbar {
        padding: 12px 5%;
      }

      .logo-text {
        font-size: 1.1rem;
      }

      .logo-img {
        width: 38px;
        height: 38px;
      }

      .nav-links {
        gap: 14px;
      }

      .nav-links a {
        font-size: 0.82rem;
      }

      main {
        padding-top: 38px;
      }

      .contact {
        flex-direction: column;
        text-align: center;
      }

      .profile-photo {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- MENÚ SUPERIOR -->
  <header class="navbar">
    <a href="#" class="logo-container">
      <img src="AA.jpg" alt="Logo Aero Atlantic" class="logo-img">
      <span class="logo-text">Aero Atlantic</span>
    </a>
    
    <nav class="nav-links" aria-label="Navegación principal">
      <a href="#contacto">Información de contacto</a>
      <!-- LINK DE INSTAGRAM REPARADO CORRECTAMENTE AQUÍ -->
      <a href="https://www.instagram.com/aero_atlanticpro/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="gallery-title">
      <h1 id="gallery-title">Nuestra Galería</h1>
      <p>A vista de pájaro.</p>
    </section>

    <section class="gallery" aria-label="Galería de imágenes">
      <div class="card">
        <img src="H.jpg" alt="Imagen H">
      </div>
      <div class="card">
        <img src="B.jpg" alt="Imagen B">
      </div>
      <div class="card">
        <img src="P.jpg" alt="Imagen P">
      </div>
      <div class="card">
        <img src="A.jpg" alt="Imagen A">
      </div>
      <div class="card">
        <img src="IMG_3336.jpg" alt="Imagen 3336">
      </div>
      <div class="card">
        <img src="IMG_3335.jpg" alt="Imagen 3335">
      </div>
      <div class="card">
        <img src="IMG_3334.jpg" alt="Imagen 3334">
      </div>
      <div class="card">
        <img src="IMG_3333.jpg" alt="Imagen 3333">
      </div>
    </section>
  </main>

  <footer class="contact" id="contacto">
    <img
      class="profile-photo"
      src="G.jpg"
      alt="Foto de perfil de Gregorio Hernández"
    >
    <div class="contact-details">
      <h2>Gregorio Hernández</h2>
      <p>Teléfono: <a href="tel:+34638128172">+34 638 128 172</a></p>
      <p>Correo: <a href="mailto:gregorio8000@gmail.com">gregorio8000@gmail.com</a></p>
    </div>
  </footer>
</body>
</html>
